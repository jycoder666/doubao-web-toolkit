<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Doubao Web Toolkit</title>
  <link rel="stylesheet" href="../dev/tokens.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../dev/preview-theme.css">
</head>
<body>
  <div class="wrap">
    <h1>Doubao Web Toolkit</h1>

    <div class="section">
      <button id="open-debug">⚙ 调试面板</button>
      <button id="open-options">配置页</button>
    </div>

    <div class="section">
      <div class="section-title">批量输入</div>
      <button id="start-batch" class="primary">▶ 开始批量发送</button>
      <button id="stop-batch">■ 停止批量发送</button>
      <button id="batch-resume">⏩ 验证码已处理，继续下一条</button>
      <div id="batch-status" class="muted">未启动</div>
    </div>

    <div class="section">
      <div class="section-title">导出对话</div>
      <button id="export-md">📄 Markdown</button>
      <button id="export-json">📦 JSON</button>
    </div>

    <div class="section">
      <div class="section-title">工具</div>
      <button id="toggle-source" class="tip" data-tip="开启后：在每条 AI 回复下方扫描链接，显示「来源 N」蓝色徽标 + 可信度分级；点击徽标可展开原始链接。关闭后徽标立即移除。">🔗 来源标注 开/关</button>
      <button id="toggle-conv" class="tip" data-tip="开启后：左侧会话列表每项出现勾选框，顶部出现「删除所选/全选」操作条，可批量删除会话（不可恢复）。关闭后恢复原生列表。">🗂 对话管理 开/关</button>
      <button id="toggle-readmark" class="tip" data-tip="开启后：自动记录每个会话读到的那一条；重开会话时顶部弹出「📌 上次读到第 N 条」提示条，可点「跳回该条」一键定位；点「跳回该条」/「×」或约 12 秒后自动淡出，都会把最新阅读位置落盘，刷新不会重复弹出。关闭后停止记录与提示。">📌 阅读标记 开/关</button>
      <button id="toggle-digest" class="tip" data-tip="开启后：右下角出现「🧾」悬浮按钮，点击在右上角弹出摘要面板，本地生成 Markdown 提纲（轮次/条数/字数 + 每轮要点），支持复制与下载，零网络请求。关闭后按钮与面板移除。">🧾 对话摘要 开/关</button>
      <button id="toggle-selection" class="tip" data-tip="开启后：对话区划词出现收藏/高亮（豆包原生选区菜单已含复制，DWT 不再重复提供）；右下角「📌」打开语料板，点击插入输入框；公式悬停可复制 LaTeX。关闭后隐藏。">📌 语料/高亮 开/关</button>
      <button id="toggle-rec" class="tip" data-tip="开启后：CSS 隐藏豆包首页推荐/建议区块。关闭后恢复。">🚫 推荐屏蔽 开/关</button>
      <button id="toggle-vibe" class="tip" data-tip="开启后：左下角色板切换五套背景氛围。默认关闭。">🎨 背景氛围 开/关</button>
      <button id="toggle-float" class="tip" data-tip="开启后：可拖拽本地便签；Ctrl+Shift+H 显隐。默认关闭。">📝 悬浮便签 开/关</button>
      <button id="toggle-comfort" class="tip" data-tip="开启后：宽屏开关 + 长回复折叠。默认关闭。">↔️ 宽屏折叠 开/关</button>
      <button id="toggle-spark" class="tip" data-tip="开启后：左下角本地生成视觉检索词。默认关闭。">🔑 视觉关键词 开/关</button>
      <button id="toggle-context" class="tip" data-tip="开启后：选中英语弹出拆行卡片。默认关闭。">🔤 英语拆行 开/关</button>
      <button id="toggle-arxiv" class="tip" data-tip="开启后：arXiv 编号插入解读提示。默认关闭。">📄 论文提示 开/关</button>
      <button id="scan-source" class="tip" data-tip="立即对当前会话的 AI 回复执行一次来源扫描（不改变开关状态）。">🔍 立即扫描来源</button>
    </div>

    <div id="status" class="muted"></div>
  </div>
  <script src="../dev/chrome-mock.js"></script>
  <script src="popup.js"></script>
</body>
</html>
