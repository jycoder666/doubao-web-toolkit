<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Doubao Web Toolkit - 配置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <h1>Doubao Web Toolkit 配置</h1>
    <p class="muted">功能开关、批量输入模板、选择器覆盖。每个功能独立开关，选择器可在页面内调试面板直接编辑。</p>

    <h2>功能开关</h2>
    <div id="features"></div>

    <h2>批量输入模板</h2>
    <p class="muted">支持 JSON（结构化）或 逐行文本（每行一条）。Tab 切换。</p>
    <div id="batch-input-config">
      <div class="tabs">
        <button class="tab active" data-tab="json">JSON</button>
        <button class="tab" data-tab="lines">逐行</button>
      </div>
      <textarea id="batch-json" class="hidden" rows="10" placeholder='[&#10;  {"text":"...", "waitType":"reply", "timeout":180}&#10;]'></textarea>
      <textarea id="batch-lines" rows="10" placeholder="请帮我写周报&#10;把上一条翻译成英文"></textarea>
    </div>

    <h2>全局设置</h2>
    <div class="row"><label>最小间隔（秒）</label><input type="number" id="min-interval" value="3"></div>
    <div class="row"><label>回复超时（秒）</label><input type="number" id="reply-timeout" value="180"></div>

    <button id="save">保存</button>
    <div id="msg"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
